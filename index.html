<!DOCTYPE html>
<html>
<head>
<title>Ajay's Birthday Surprise</title>
</head>

<button onclick="checkPassword()">Enter</button>

<script>
function checkPassword() {

if(password === "1409") {
document.getElementById("message").innerHTML =
"✅ Access Granted! Happy Birthday Ajay!";
}
else {
document.getElementById("message").innerHTML =
"❌ Wrong Passcode. Try Again.";

}
</script>

</body>
